<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MilieuAlert - Low Emission Zone warnings for drivers">
  <meta name="theme-color" content="#00E5FF">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MilieuAlert">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MilieuAlert</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0A0A1A;
      color: #00E5FF;
      font-family: system-ui, sans-serif;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }
    #boot span { letter-spacing: 2px; font-weight: 700; }
    /* Address fields must show real characters, never password bullets */
    textarea.flt-text-editing,
    input.flt-text-editing[type="text"],
    input.flt-text-editing[type="search"],
    input.flt-text-editing[type="email"],
    input.flt-text-editing[type="tel"] {
      -webkit-text-security: none !important;
      letter-spacing: normal !important;
    }
  </style>

  <script>
    window.__milieuPwa = { deferred: null };

    function milieuPwaCanInstall() {
      return !!window.__milieuPwa.deferred;
    }

    function milieuPwaIsStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    }

    async function milieuPwaPromptInstall() {
      const promptEvent = window.__milieuPwa.deferred;
      if (!promptEvent) return 'unavailable';
      promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      window.__milieuPwa.deferred = null;
      return choice.outcome || 'dismissed';
    }

    function milieuPwaDownloadShortcut() {
      const origin = location.origin;
      const content = '[InternetShortcut]\r\nURL=' + origin + '/\r\n';
      const blob = new Blob([content], { type: 'application/internet-shortcut' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'MilieuAlert.url';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function milieuPwaDownloadLauncher() {
      const origin = location.origin;
      const html = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
        + '<meta http-equiv="refresh" content="0;url=' + origin + '/">'
        + '<title>MilieuAlert</title></head><body>'
        + '<p>Opening <a href="' + origin + '/">MilieuAlert</a>&hellip;</p>'
        + '<script>location.replace(' + JSON.stringify(origin + '/') + ');<\/script>'
        + '</body></html>';
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'MilieuAlert.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__milieuPwa.deferred = e;
    });

    window.addEventListener('appinstalled', () => {
      window.__milieuPwa.deferred = null;
    });

    window.addEventListener('flutter-first-frame', () => {
      const boot = document.getElementById('boot');
      if (boot) boot.remove();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: '/' }).catch((err) => {
          console.warn('MilieuAlert service worker registration failed:', err);
        });
      });
    }
  </script>
</head>
<body>
  <div id="boot">
    <span>MILIEUALERT</span>
    <small style="color:#8be9ff">Loading map &amp; GPS…</small>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
